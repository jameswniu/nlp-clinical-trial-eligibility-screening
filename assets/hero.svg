<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="Clinical trial eligibility screening that abstains instead of guessing: 50 golden decisions replayed in CI, 67 of 550 criterion verdicts abstain and say why, and hand-checking the shipped outputs caught 7 wrong admissions">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1013"/>
      <stop offset="1" stop-color="#122028"/>
    </linearGradient>
  </defs>
  <style>
    .ht  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #dfe3e0; font-size: 48px; font-weight: 700; text-anchor: middle; }
    .hs  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #8f9491; font-size: 27px; text-anchor: middle; }
    .num { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #5eead4; font-size: 40px; font-weight: 700; text-anchor: middle; }
    .lab { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #8f9491; font-size: 22px; text-anchor: middle; }
    .kw  { fill: #5eead4; }
  </style>
  <rect width="1200" height="340" fill="url(#hbg)"/>
  <rect x="0" y="0" width="1200" height="4" fill="#2dd4bf"/>

  <text x="600" y="96" class="ht">Clinical Trial Eligibility Screening</text>
  <text x="600" y="146" class="hs">Evidence-cited verdicts that <tspan class="kw">abstain instead of guessing</tspan>, gated in CI</text>

  <text x="195"  y="240" class="num">50</text>
  <text x="195"  y="278" class="lab">decisions</text>
  <text x="195"  y="306" class="lab">25 patients x 2</text>

  <text x="465" y="240" class="num">67 / 550</text>
  <text x="465" y="278" class="lab">verdicts abstain,</text>
  <text x="465" y="306" class="lab">each names its gap</text>

  <text x="735" y="240" class="num">7 / 25</text>
  <text x="735" y="278" class="lab">wrong admissions</text>
  <text x="735" y="306" class="lab">caught by hand</text>

  <text x="1005" y="240" class="num">41</text>
  <text x="1005" y="278" class="lab">tests, no model</text>
  <text x="1005" y="306" class="lab">needed to run</text>
</svg>
