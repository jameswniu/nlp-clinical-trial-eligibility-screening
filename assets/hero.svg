<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="Clinical trial eligibility screening that abstains instead of guessing: 200 golden patients across two tiers, 70 planted traps with 30 known-wrong verdicts pinned, 7 of 25 wrong admissions caught by hand, and a 1,000-patient benchmark at 35.3 patients per second">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1613"/>
      <stop offset="1" stop-color="#17261f"/>
    </linearGradient>
  </defs>
  <style>
    .ht  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #ecf5f0; font-size: 48px; font-weight: 700; text-anchor: middle; }
    .hs  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #a7c3b6; font-size: 27px; text-anchor: middle; }
    .num { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #7cc9a4; font-size: 40px; font-weight: 700; text-anchor: middle; }
    .lab { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #a7c3b6; font-size: 22px; text-anchor: middle; }
    .kw  { fill: #7cc9a4; }
  </style>
  <rect width="1200" height="340" fill="url(#hbg)"/>
  <rect x="0" y="0" width="1200" height="3" fill="#57977c"/>

  <text x="600" y="96" class="ht">Clinical Trial Eligibility Screening</text>
  <text x="600" y="146" class="hs">Evidence-cited verdicts that <tspan class="kw">abstain instead of guessing</tspan>, gated in CI</text>

  <text x="195"  y="240" class="num">200</text>
  <text x="195"  y="278" class="lab">golden patients</text>
  <text x="195"  y="306" class="lab">two tiers: 25 + 175</text>

  <text x="465" y="240" class="num">70</text>
  <text x="465" y="278" class="lab">planted traps,</text>
  <text x="465" y="306" class="lab">30 known-wrong</text>

  <text x="735" y="240" class="num">7 / 25</text>
  <text x="735" y="278" class="lab">wrong admissions</text>
  <text x="735" y="306" class="lab">caught by hand</text>

  <text x="1005" y="240" class="num">1,000</text>
  <text x="1005" y="278" class="lab">patient batch,</text>
  <text x="1005" y="306" class="lab">35.3 patients/s</text>
</svg>
