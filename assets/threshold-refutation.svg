<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Every hand-labelled similarity score plotted by what the note actually says: supported criteria score as low as 0.12 while an unsupported one scores 0.51, so no threshold on this axis separates them; both shipped thresholds are refuted">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1613"/>
      <stop offset="1" stop-color="#17261f"/>
    </linearGradient>
  </defs>
  <style>
    .h  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #ecf5f0; font-size: 26px; font-weight: 600; }
    .m  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #a7c3b6; font-size: 22px; }
    .tk { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #6f8d81; font-size: 22px; }
    .an { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #ecf5f0; font-size: 22px; }
    .dot { stroke: #0e1613; stroke-width: 2; }
    .thr { stroke: #d9e5df; stroke-width: 1.6; stroke-dasharray: 7 6; }
  </style>
  <rect width="1200" height="420" fill="url(#tbg)"/>

  <text x="60" y="56" class="h">17 labelled scores, by what the note actually says</text>
  <text x="60" y="88" class="m">MiniLM similarity of criterion vs clinical note; both shipped thresholds REFUTED</text>

  <line x1="328" y1="118" x2="328" y2="330" class="thr"/>
  <text x="240" y="146" class="m">MAYBE 0.10</text>
  <line x1="417" y1="118" x2="417" y2="330" class="thr"/>
  <text x="429" y="146" class="m">PASS 0.15</text>

  <text x="60" y="204" class="m" fill="#35a179">supported</text>
  <circle cx="364" cy="196" r="9" class="dot" fill="#35a179"/>
  <circle cx="417" cy="196" r="9" class="dot" fill="#35a179"/>
  <circle cx="667" cy="196" r="9" class="dot" fill="#35a179"/>
  <circle cx="702" cy="196" r="9" class="dot" fill="#35a179"/>
  <circle cx="791" cy="196" r="9" class="dot" fill="#35a179"/>

  <text x="60" y="264" class="m" fill="#5e8fd4">uncertain</text>
  <circle cx="328" cy="256" r="9" class="dot" fill="#5e8fd4"/>
  <circle cx="435" cy="256" r="9" class="dot" fill="#5e8fd4"/>

  <text x="60" y="324" class="m" fill="#c9564f">unsupported</text>
  <circle cx="269" cy="316" r="9" class="dot" fill="#c9564f"/>
  <circle cx="281" cy="316" r="9" class="dot" fill="#c9564f"/>
  <circle cx="328" cy="316" r="9" class="dot" fill="#c9564f"/>
  <circle cx="417" cy="316" r="9" class="dot" fill="#c9564f"/>
  <circle cx="488" cy="316" r="9" class="dot" fill="#c9564f"/>
  <circle cx="667" cy="316" r="9" class="dot" fill="#c9564f"/>
  <circle cx="1059" cy="316" r="9" class="dot" fill="#c9564f"/>

  <text x="700" y="264" class="an">0.51: "active smoker, 18 pack-years"</text>
  <text x="700" y="292" class="an" fill="#a7c3b6">scored vs a non-smoker criterion</text>
  <text x="440" y="238" class="an">0.12: 35 years of documented exposure</text>

  <line x1="150" y1="352" x2="1130" y2="352" stroke="#31463d" stroke-width="1.6"/>
  <text x="143" y="388" class="tk">0.0</text>
  <text x="321" y="388" class="tk">0.1</text>
  <text x="499" y="388" class="tk">0.2</text>
  <text x="677" y="388" class="tk">0.3</text>
  <text x="855" y="388" class="tk">0.4</text>
  <text x="1033" y="388" class="tk">0.5</text>
</svg>
