<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-label="Pipeline architecture: protocols, patient records, and clinical notes flow through normalization into a two-lane evaluator, out to per-criterion verdicts with evidence, and a golden-dataset gate checks the whole thing in CI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14181d"/>
      <stop offset="1" stop-color="#1c232a"/>
    </linearGradient>
  </defs>
  <style>
    .box { fill: #242c35; stroke: #45525f; stroke-width: 1.6; }
    .lane { fill: #1a2129; stroke: #333e49; stroke-width: 1.3; }
    .guard { fill: #20302a; stroke: #5f8d76; stroke-width: 1.8; }
    .t { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #dfe4e8; font-size: 24px; }
    .th { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #e8ebee; font-size: 26px; font-weight: 600; }
    .tm { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #9fa9b2; font-size: 22px; }
    .ta { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #a9c7b9; font-size: 24px; }
    .flow { stroke: #5c6b79; stroke-width: 1.8; fill: none; marker-end: url(#arr); }
  </style>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5c6b79"/>
  </marker>
  <rect width="1200" height="660" fill="url(#bg)"/>

  <text x="48" y="52" class="tm" letter-spacing="6" fill="#a9c7dd">ARCHITECTURE</text>

  <rect x="48"  y="78" width="330" height="72" rx="6" class="box"/>
  <text x="70"  y="108" class="th">protocol YAMLs</text>
  <text x="70"  y="136" class="tm">inclusion + exclusion</text>

  <rect x="435" y="78" width="330" height="72" rx="6" class="box"/>
  <text x="457" y="108" class="th">patients.csv</text>
  <text x="457" y="136" class="tm">+ lab_results.csv</text>

  <rect x="822" y="78" width="330" height="72" rx="6" class="box"/>
  <text x="844" y="108" class="th">clinical notes</text>
  <text x="844" y="136" class="tm">25 synthetic .txt files</text>

  <line x1="213" y1="150" x2="213" y2="192" class="flow"/>
  <line x1="600" y1="150" x2="600" y2="192" class="flow"/>
  <line x1="987" y1="150" x2="987" y2="192" class="flow"/>

  <rect x="48"  y="196" width="330" height="72" rx="6" class="box"/>
  <text x="70"  y="226" class="th">protocol_sorter.py</text>
  <text x="70"  y="254" class="tm">repair + split</text>

  <rect x="435" y="196" width="717" height="72" rx="6" class="box"/>
  <text x="457" y="226" class="th">data_loader.py</text>
  <text x="457" y="254" class="tm">one profile each: age, flags, latest labs, notes</text>

  <line x1="213" y1="268" x2="213" y2="310" class="flow"/>
  <line x1="600" y1="268" x2="600" y2="310" class="flow"/>

  <rect x="48" y="314" width="1104" height="120" rx="6" class="box"/>
  <text x="70" y="346" class="th">protocol_evaluator.py + note_parser.py</text>
  <rect x="70"  y="362" width="520" height="56" rx="5" class="lane"/>
  <text x="88"  y="396" class="t">structured: age, flags, labs</text>
  <rect x="610" y="362" width="520" height="56" rx="5" class="lane"/>
  <text x="628" y="396" class="t">unstructured: MiniLM matching</text>

  <line x1="600" y1="434" x2="600" y2="476" class="flow"/>

  <rect x="48" y="480" width="1104" height="76" rx="6" class="box"/>
  <text x="70" y="512" class="th">per criterion: PASS / MAYBE / FAIL, evidence string, score</text>
  <text x="70" y="540" class="tm">confidence = mean(PASS=1, MAYBE=0.5); any FAIL disqualifies; no data abstains</text>

  <line x1="600" y1="556" x2="600" y2="586" class="flow"/>
  <rect x="48" y="590" width="1104" height="52" rx="6" class="guard"/>
  <text x="70" y="624" class="ta">the gate: 50 golden decisions + labelled exemplars, replayed in CI</text>
</svg>
