<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-label="Screening outcomes from the 50 golden decisions: 7 of 25 patients eligible for the oncology protocol and 5 of 25 for the respiratory protocol, and the 550 criterion verdicts split into 436 PASS, 67 MAYBE, 47 FAIL">
  <defs>
    <linearGradient id="obg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1613"/>
      <stop offset="1" stop-color="#17261f"/>
    </linearGradient>
  </defs>
  <style>
    .h  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #ecf5f0; font-size: 26px; font-weight: 600; }
    .m  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #a7c3b6; font-size: 22px; }
    .v  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #ecf5f0; font-size: 22px; }
    .vd { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0e1613; font-size: 22px; font-weight: 600; }
  </style>
  <rect width="1200" height="380" fill="url(#obg)"/>

  <text x="60" y="64" class="h">Who gets through, per protocol</text>
  <text x="60" y="96" class="m">of 25 patients screened each</text>

  <text x="60" y="152" class="m">oncology</text>
  <rect x="60" y="166" width="121" height="44" rx="3" fill="#35a179"/>
  <rect x="185" y="166" width="313" height="44" rx="3" fill="#31463d"/>
  <text x="74" y="196" class="vd">7</text>
  <text x="199" y="196" class="v">18 disqualified</text>

  <text x="60" y="262" class="m">respiratory</text>
  <rect x="60" y="276" width="86" height="44" rx="3" fill="#35a179"/>
  <rect x="150" y="276" width="348" height="44" rx="3" fill="#31463d"/>
  <text x="74" y="306" class="vd">5</text>
  <text x="164" y="306" class="v">20 disqualified</text>

  <text x="60" y="356" class="m">any single FAIL disqualifies</text>

  <text x="640" y="64" class="h">550 criterion verdicts</text>
  <text x="640" y="96" class="m">across all 50 decisions</text>

  <rect x="640" y="166" width="393" height="44" rx="3" fill="#35a179"/>
  <rect x="1037" y="166" width="58" height="44" rx="3" fill="#5e8fd4"/>
  <rect x="1099" y="166" width="41" height="44" rx="3" fill="#c9564f"/>
  <text x="654" y="196" class="vd">436 PASS</text>

  <rect x="640" y="240" width="18" height="18" rx="3" fill="#35a179"/>
  <text x="668" y="256" class="m">PASS 436</text>
  <rect x="810" y="240" width="18" height="18" rx="3" fill="#5e8fd4"/>
  <text x="838" y="256" class="m">MAYBE 67</text>
  <rect x="988" y="240" width="18" height="18" rx="3" fill="#c9564f"/>
  <text x="1016" y="256" class="m">FAIL 47</text>

  <text x="640" y="322" class="m">67 abstentions each name their missing datum;</text>
  <text x="640" y="352" class="m">47 failures each cite the disqualifying value</text>
</svg>
